
name: Deployment Notification

on:
  workflow_run:
    workflows: ["Deploy Profile Website"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify on Success
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "Deployment successful!"

          curl -X POST \
            -H "Content-type: application/json" \
            --data '{"text":"🚀 Profile website deployed successfully! Visit: https://heeranya-rajagopal.github.io/Heeranya-Profile/"}' \
            "$SLACK_WEBHOOK_URL"

      - name: Notify on Failure
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "Deployment failed!"

          curl -X POST \
            -H "Content-type: application/json" \
            --data '{"text":"❌ Profile website deployment FAILED! Please check GitHub Actions."}' \
            "$SLACK_WEBHOOK_URL"
